version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    # Wait for new releases to age before proposing them, so a compromised
    # release is likely pulled/yanked before Dependabot suggests it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/agent-support/vscode"
    target-branch: "main"
    schedule:
      interval: "weekly"
    # Wait for new releases to age before proposing them, so a compromised
    # release is likely pulled/yanked before Dependabot suggests it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(vscode-plugin)"

  - package-ecosystem: "npm"
    directory: "/agent-support/opencode"
    target-branch: "main"
    schedule:
      interval: "weekly"
    # Wait for new releases to age before proposing them, so a compromised
    # release is likely pulled/yanked before Dependabot suggests it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(opencode-plugin)"

  - package-ecosystem: "gradle"
    directory: "/agent-support/intellij"
    target-branch: "main"
    schedule:
      interval: "weekly"
    # Wait for new releases to age before proposing them, so a compromised
    # release is likely pulled/yanked before Dependabot suggests it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(intellij-plugin)"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    # Wait for new releases to age before proposing them, so a compromised
    # release is likely pulled/yanked before Dependabot suggests it.
    cooldown:
      default-days: 7
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    commit-message:
      prefix: "chore(ci)"
