name: Performance Benchmarks

permissions:
  contents: read

env:
  NIGHTLY_NASTY_FEATURE_COMMITS: "90"
  NIGHTLY_NASTY_MAIN_COMMITS: "35"
  NIGHTLY_NASTY_SIDE_COMMITS: "25"
  NIGHTLY_NASTY_FILES: "6"
  NIGHTLY_NASTY_LINES_PER_FILE: "1500"
  NIGHTLY_NASTY_BURST_EVERY: "15"
  NIGHTLY_NASTY_REPETITIONS: "10"

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Taskfile.yml'
      - 'scripts/benchmarks/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/actions/**'
      - '.github/workflows/performance-benchmarks.yml'
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  pr-smoke-nasty:
    if: github.event_name == 'pull_request'
    name: PR Smoke Nasty Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup benchmark toolchain
        uses: ./.github/actions/setup-performance-benchmarks
        with:
          cache-key: ${{ runner.os }}-perf-smoke-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-perf-smoke-
            ${{ runner.os }}-perf-

      - name: Run reduced nasty benchmark gate
        run: |
          python3 scripts/benchmarks/git/benchmark_nasty_modes_vs_main.py \
            --work-root .benchmarks/pr-smoke \
            --feature-commits 24 \
            --main-commits 10 \
            --side-commits 8 \
            --files 4 \
            --lines-per-file 1000 \
            --burst-every 6 \
            --repetitions 5 \
            --margin-pct 55 \
            --margin-baseline main_daemon \
            --enforce-margin

      - name: Upload smoke benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-smoke-nasty-benchmarks
          path: .benchmarks/pr-smoke/artifacts/**
          if-no-files-found: ignore

  pr-flamegraph-smoke:
    if: github.event_name == 'pull_request'
    name: PR Flamegraph Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup benchmark toolchain
        uses: ./.github/actions/setup-performance-benchmarks
        with:
          cache-key: ${{ runner.os }}-perf-smoke-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-perf-smoke-
            ${{ runner.os }}-perf-

      - name: Install profiling tools
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common linux-tools-generic || true
          if ! command -v perf >/dev/null 2>&1; then
            sudo apt-get install -y "linux-tools-$(uname -r)"
          fi
          perf --version
          cargo install inferno --version 0.12.6 --locked

      - name: Enable perf events
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=-1
          test "$(cat /proc/sys/kernel/perf_event_paranoid)" = "-1"

      - name: Run profiled smoke benchmark
        run: |
          python3 scripts/benchmarks/git/benchmark_nasty_modes_vs_main.py \
            --work-root .benchmarks/pr-flamegraphs \
            --feature-commits 8 \
            --main-commits 4 \
            --side-commits 3 \
            --files 2 \
            --lines-per-file 300 \
            --burst-every 2 \
            --repetitions 1 \
            --flamegraph-dir .benchmarks/pr-flamegraphs/profiles \
            --margin-pct 80 \
            --margin-baseline main_daemon

      - name: Render flamegraphs
        if: always()
        run: |
          bash scripts/benchmarks/git/render_flamegraphs.sh \
            .benchmarks/pr-flamegraphs/profiles \
            .benchmarks/pr-flamegraphs/artifacts/flamegraphs

      - name: Upload flamegraph smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-flamegraph-benchmarks
          path: .benchmarks/pr-flamegraphs/**
          if-no-files-found: ignore

  nightly-full-benchmarks:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Nightly Full Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup benchmark toolchain
        uses: ./.github/actions/setup-performance-benchmarks
        with:
          cache-key: ${{ runner.os }}-perf-nightly-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-perf-nightly-
            ${{ runner.os }}-perf-

      - name: Run heavy benchmark matrix gate
        run: |
          python3 scripts/benchmarks/git/benchmark_modes_vs_main.py \
            --work-root .benchmarks/nightly-modes \
            --iterations-basic 10 \
            --iterations-complex 10 \
            --margin-pct 25 \
            --margin-baseline main_daemon \
            --enforce-margin

      - name: Run full nasty benchmark gate
        run: |
          python3 scripts/benchmarks/git/benchmark_nasty_modes_vs_main.py \
            --work-root .benchmarks/nightly-nasty \
            --feature-commits "$NIGHTLY_NASTY_FEATURE_COMMITS" \
            --main-commits "$NIGHTLY_NASTY_MAIN_COMMITS" \
            --side-commits "$NIGHTLY_NASTY_SIDE_COMMITS" \
            --files "$NIGHTLY_NASTY_FILES" \
            --lines-per-file "$NIGHTLY_NASTY_LINES_PER_FILE" \
            --burst-every "$NIGHTLY_NASTY_BURST_EVERY" \
            --repetitions "$NIGHTLY_NASTY_REPETITIONS" \
            --margin-pct 25 \
            --margin-baseline main_daemon \
            --enforce-margin

      - name: Upload nightly benchmark artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-performance-benchmarks
          path: |
            .benchmarks/nightly-modes/artifacts/**
            .benchmarks/nightly-nasty/artifacts/**
          if-no-files-found: ignore

  nightly-flamegraph-benchmarks:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Nightly Flamegraph Performance Profiles
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup benchmark toolchain
        uses: ./.github/actions/setup-performance-benchmarks
        with:
          cache-key: ${{ runner.os }}-perf-nightly-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-perf-nightly-
            ${{ runner.os }}-perf-

      - name: Install profiling tools
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common linux-tools-generic || true
          if ! command -v perf >/dev/null 2>&1; then
            sudo apt-get install -y "linux-tools-$(uname -r)"
          fi
          perf --version
          cargo install inferno --version 0.12.6 --locked

      - name: Enable perf events
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=-1
          test "$(cat /proc/sys/kernel/perf_event_paranoid)" = "-1"

      - name: Run profiled nasty benchmark
        run: |
          python3 scripts/benchmarks/git/benchmark_nasty_modes_vs_main.py \
            --work-root .benchmarks/nightly-flamegraphs \
            --feature-commits "$NIGHTLY_NASTY_FEATURE_COMMITS" \
            --main-commits "$NIGHTLY_NASTY_MAIN_COMMITS" \
            --side-commits "$NIGHTLY_NASTY_SIDE_COMMITS" \
            --files "$NIGHTLY_NASTY_FILES" \
            --lines-per-file "$NIGHTLY_NASTY_LINES_PER_FILE" \
            --burst-every "$NIGHTLY_NASTY_BURST_EVERY" \
            --repetitions "$NIGHTLY_NASTY_REPETITIONS" \
            --flamegraph-dir .benchmarks/nightly-flamegraphs/profiles \
            --margin-pct 25 \
            --margin-baseline main_daemon

      - name: Render flamegraphs
        if: always()
        run: |
          bash scripts/benchmarks/git/render_flamegraphs.sh \
            .benchmarks/nightly-flamegraphs/profiles \
            .benchmarks/nightly-flamegraphs/artifacts/flamegraphs

      - name: Upload flamegraph artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-flamegraph-benchmarks
          path: .benchmarks/nightly-flamegraphs/**
          if-no-files-found: ignore
